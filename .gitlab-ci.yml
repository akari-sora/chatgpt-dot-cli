workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, chatgpt-dot-cli]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - pip install -e ".[mcp]"
    - python -m unittest discover -s tests -v

release:
  stage: release
  image: python:3.12-slim
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends curl ca-certificates
      arch=$(dpkg --print-architecture)
      case "$arch" in
        amd64) bin_arch=amd64 ;;
        arm64) bin_arch=arm64 ;;
        armhf) bin_arch=arm ;;
        i386) bin_arch=386 ;;
        ppc64el) bin_arch=ppc64le ;;
        *)
          echo "unsupported architecture: $arch" >&2
          exit 1
          ;;
      esac
      curl -fsSL -o /usr/local/bin/release-cli \
        "https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-${bin_arch}"
      chmod +x /usr/local/bin/release-cli
      python - <<'PY'
      import os
      import pathlib
      import re
      tag = os.environ["CI_COMMIT_TAG"]
      text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
      match = re.search(rf"(?ms)^## {re.escape(tag)}\n(.*?)(?=^## |\Z)", text)
      notes = match.group(1).strip() if match else f"Release {tag}"
      pathlib.Path("/tmp/release-notes.txt").write_text(notes + "\n", encoding="utf-8")
      PY
      if release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$(cat /tmp/release-notes.txt)"; then
        exit 0
      fi
      http_code=$(curl -sS -o /tmp/release-api.txt -w "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}")
      if [ "$http_code" = "200" ]; then
        exit 0
      fi
      echo "release API status ${http_code}"
      exit 1
