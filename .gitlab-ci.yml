workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, chatgpt-dot-cli]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[mcp]" || pip install -e .
    - python -m unittest discover -s tests -v

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "Release $CI_COMMIT_TAG"; then
        exit 0
      fi
      wget -q -O /dev/null --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG"
      echo "Release $CI_COMMIT_TAG already exists"
