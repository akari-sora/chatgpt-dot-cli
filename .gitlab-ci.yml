workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, chatgpt-dot-cli]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - pip install -e ".[mcp]"
    - python -m unittest discover -s tests -v

release:
  stage: release
  image: python:3.12-slim
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      arch=$(dpkg --print-architecture)
      case "$arch" in
        amd64) bin_arch=amd64 ;;
        arm64) bin_arch=arm64 ;;
        armhf) bin_arch=arm ;;
        i386) bin_arch=386 ;;
        ppc64el) bin_arch=ppc64le ;;
        *)
          echo "unsupported architecture: $arch" >&2
          exit 1
          ;;
      esac
      BIN_ARCH="$bin_arch" python - <<'PY'
      import os
      import pathlib
      import re
      import urllib.request

      url = (
          "https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-"
          + os.environ["BIN_ARCH"]
      )
      dest = pathlib.Path("/usr/local/bin/release-cli")
      urllib.request.urlretrieve(url, dest)
      dest.chmod(0o755)
      tag = os.environ["CI_COMMIT_TAG"]
      text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
      match = re.search(rf"(?ms)^## {re.escape(tag)}\n(.*?)(?=^## |\Z)", text)
      notes = match.group(1).strip() if match else f"Release {tag}"
      pathlib.Path("/tmp/release-notes.txt").write_text(notes + "\n", encoding="utf-8")
      PY
      if release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$(cat /tmp/release-notes.txt)"; then
        exit 0
      fi
      python - <<'PY'
      import os
      import urllib.error
      import urllib.request

      tag = os.environ["CI_COMMIT_TAG"]
      url = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/releases/{tag}"
      request = urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(request) as response:
              code = response.status
      except urllib.error.HTTPError as exc:
          code = exc.code
      if code == 200:
          raise SystemExit(0)
      print(f"release API status {code}")
      raise SystemExit(1)
      PY
